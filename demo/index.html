<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HKTE Notices Card Preview</title>
    <style>
      :root {
        --primary-text-color: #202124;
        --secondary-text-color: #697078;
        --primary-color: #087f5b;
        --divider-color: #dfe3e6;
        --secondary-background-color: #f4f6f7;
        --warning-color: #e9a400;
        --error-color: #b3261e;
      }
      body {
        margin: 0;
        padding: 28px;
        background: #edf1f2;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      hkte-notices-card {
        max-width: 720px;
        margin: 0 auto;
      }
      ha-card {
        display: block;
        background: white;
        border: 1px solid #d9dfe2;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(23, 33, 38, 0.08);
      }
      @media (max-width: 480px) {
        body {
          padding: 10px;
        }
      }
    </style>
  </head>
  <body>
    <hkte-notices-card id="card"></hkte-notices-card>
    <script type="module">
      import "/src/index.ts";
      customElements.define(
        "ha-icon",
        class extends HTMLElement {
          connectedCallback() {
            const icon = this.getAttribute("icon");
            this.textContent =
              icon === "mdi:download"
                ? "↓"
                : icon === "mdi:calendar-clock"
                  ? "▣"
                  : "AI";
          }
        },
      );
      const jobs = new Map();
      const result = {
        enabled: true,
        status: "completed",
        sources: [
          { attachment_id: "a1", filename: "學校旅行家長通告.pdf", page: 1 },
        ],
        summary: Object.fromEntries(
          [
            ["highlights", "學校旅行安排，請穿著運動服。"],
            ["dates", "9 月 12 日上午 8 時回校。"],
            ["costs", "未提供"],
            ["actions", "準備水樽及運動服，確認集合時間。"],
            ["questions", "雨天安排未提供，請向學校確認。"],
          ].map(([key, text]) => [
            key,
            [{ text, sources: [{ attachment_id: "a1", page: 1 }] }],
          ]),
        ),
      };
      const longTitle =
        "學校旅行與戶外學習日重要安排及家長須知 Very long notice title for responsive testing";
      const card = document.querySelector("#card");
      card.setConfig({
        type: "custom:hkte-notices-card",
        title: "HKTE 通告",
        filter: "all",
        limit: 5,
        initially_expanded: "latest",
        show_attachments: true,
      });
      card.hass = {
        fetchWithAuth: async (path, init) => {
          if (path.includes("/attachment/"))
            return new Response("Synthetic demo attachment", {
              headers: { "Content-Type": "text/plain" },
            });
          if (init?.method === "POST") {
            jobs.set(path, Date.now());
            return Response.json({
              enabled: true,
              status: "running",
              stage: "downloading",
              processed: 0,
            });
          }
          if (!jobs.has(path))
            return Response.json({ enabled: true, status: "idle" });
          if (Date.now() - jobs.get(path) < 3000)
            return Response.json({
              enabled: true,
              status: "running",
              stage: "analyzing",
              processed: 1,
            });
          return Response.json(result);
        },
        locale: { language: "zh-Hant" },
        states: {
          "sensor.chan_tai_man_notice_content": {
            state: "2",
            attributes: {
              friendly_name: "陳大文 通告內容",
              has_more: false,
              notices: [
                {
                  id: "n2",
                  title: longTitle,
                  content:
                    "請家長細閱以下安排：\n\n學生須於上午八時正回校，並穿著整齊運動服。正文只會以純文字顯示。",
                  issued_at: "2026-09-08T08:30:00+08:00",
                  deadline: "2026-09-12T23:59:00+08:00",
                  unread: true,
                  replied: false,
                  content_truncated: false,
                  attachments: [
                    {
                      id: "a1",
                      filename: "學校旅行家長通告及回條-超長檔案名稱測試.pdf",
                      mime_type: "application/pdf",
                      size: 245760,
                    },
                  ],
                },
                {
                  id: "n1",
                  title: "九月份午膳安排",
                  content: "本月餐單已隨通告附上。",
                  issued_at: "2026-09-05T12:00:00+08:00",
                  deadline: null,
                  unread: false,
                  replied: true,
                  content_truncated: false,
                  attachments: [],
                },
              ],
            },
          },
        },
      };
    </script>
  </body>
</html>
